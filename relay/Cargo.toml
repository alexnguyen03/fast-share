[package]
name = "fast-share-relay"
version = "0.1.0"
description = "Self-hosted relay for Fast Share: pipes encrypted WebSocket frames between a computer and a phone, stores nothing"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fast_share_relay"

[[bin]]
name = "fast-share-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

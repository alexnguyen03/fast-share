name: Bug report
description: Something failed while pairing or sending images
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you expected and what the app did instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Phone and computer, for example iOS 18 and Windows 11.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: dropdown
    id: same-wifi
    attributes:
      label: Were both devices on the same Wi-Fi?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Do not paste tokens, QR contents, or real screenshots.
